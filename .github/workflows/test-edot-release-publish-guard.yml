---
name: test-edot-release-publish-guard

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-publish-guard.yml'
      - 'edot-release/publish-guard/**'
      - 'edot-release/prepare-start/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-publish-guard.yml'
      - 'edot-release/publish-guard/**'
      - 'edot-release/prepare-start/**'

permissions:
  contents: read
  pull-requests: read

# The fixture repository is built at the workspace root by
# edot-release/prepare-start/test-data/fixture.sh, next to this checkout in
# oblt-actions/, with the Android .github/edot-release.json and a bare
# origin in the runner's temporary directory. The steps pass the event
# values explicitly, because this workflow's own event is not a merged
# preparation pull request.
env:
  FIXTURE: oblt-actions/edot-release/prepare-start/test-data/fixture.sh

jobs:
  test:
    if: always()
    needs:
      - valid
      - invalid
    runs-on: ubuntu-slim
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}

  valid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      - id: fixture
        name: Create merged preparation commit
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          "$FIXTURE" set-version 99.0.0
          "$FIXTURE" add-section 99.0.0
          sha=$("$FIXTURE" commit 'Prepare release 99.0.0')
          git push --quiet origin "$sha:refs/heads/releasing/99.0.0"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: untagged
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.0.0
          head-ref: prepare/99.0.0
          merge-commit: ${{ steps.fixture.outputs.sha }}

      - name: Verify untagged release
        env:
          SHA: ${{ steps.fixture.outputs.sha }}
          VERSION: ${{ steps.untagged.outputs.version }}
          TAG_EXISTS: ${{ steps.untagged.outputs.tag-exists }}
          RELEASE: ${{ steps.untagged.outputs.release }}
        run: |
          test "$VERSION" = 99.0.0
          test "$TAG_EXISTS" = false
          jq -e --arg sha "$SHA" '
            . == {sha: $sha, version: "99.0.0", baseRef: "releasing/99.0.0", tagExists: false}
          ' <<<"$RELEASE"

      # A previous run published: the tag exists on origin at the merge
      # commit, so publication is skipped.
      - name: Tag the merge commit on origin
        env:
          SHA: ${{ steps.fixture.outputs.sha }}
        run: git push --quiet origin "$SHA:refs/tags/v99.0.0"

      - id: tagged
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.0.0
          head-ref: prepare/99.0.0
          merge-commit: ${{ steps.fixture.outputs.sha }}

      - name: Verify tagged release
        env:
          SHA: ${{ steps.fixture.outputs.sha }}
          VERSION: ${{ steps.tagged.outputs.version }}
          TAG_EXISTS: ${{ steps.tagged.outputs.tag-exists }}
          RELEASE: ${{ steps.tagged.outputs.release }}
        run: |
          test "$VERSION" = 99.0.0
          test "$TAG_EXISTS" = true
          jq -e --arg sha "$SHA" '
            . == {sha: $sha, version: "99.0.0", baseRef: "releasing/99.0.0", tagExists: true}
          ' <<<"$RELEASE"

  invalid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      # A merged 99.0.0 preparation commit, a development commit on top, and
      # a v99.0.0 tag at an unrelated commit.
      - id: fixture
        name: Create fixture
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          "$FIXTURE" set-version 99.0.0
          "$FIXTURE" add-section 99.0.0
          release=$("$FIXTURE" commit 'Prepare release 99.0.0')
          "$FIXTURE" set-version 99.1.0-SNAPSHOT
          development=$("$FIXTURE" commit 'Prepare for the next release')
          git tag v99.0.0 v98.0.0
          git push --quiet origin \
            "$development:refs/heads/releasing/99.0.0" \
            refs/tags/v99.0.0:refs/tags/v99.0.0
          "$FIXTURE" snapshot
          {
            echo "release=$release"
            echo "development=$development"
          } >> "$GITHUB_OUTPUT"

      - id: other-head
        continue-on-error: true
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.0.0
          head-ref: feature/x
          merge-commit: ${{ steps.fixture.outputs.release }}
      - if: steps.other-head.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: other-base
        continue-on-error: true
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.0.1
          head-ref: prepare/99.0.0
          merge-commit: ${{ steps.fixture.outputs.release }}
      - if: steps.other-base.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: tag-elsewhere
        continue-on-error: true
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.0.0
          head-ref: prepare/99.0.0
          merge-commit: ${{ steps.fixture.outputs.release }}
      - if: steps.tag-elsewhere.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Abbreviate the merge commit
        id: short
        env:
          RELEASE: ${{ steps.fixture.outputs.release }}
        run: echo "sha=${RELEASE:0:12}" >> "$GITHUB_OUTPUT"
      - id: short-sha
        continue-on-error: true
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.0.0
          head-ref: prepare/99.0.0
          merge-commit: ${{ steps.short.outputs.sha }}
      - if: steps.short-sha.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: development-version
        continue-on-error: true
        uses: ./oblt-actions/edot-release/publish-guard
        with:
          base-ref: releasing/99.1.0-SNAPSHOT
          head-ref: prepare/99.1.0-SNAPSHOT
          merge-commit: ${{ steps.fixture.outputs.development }}
      - if: steps.development-version.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'
