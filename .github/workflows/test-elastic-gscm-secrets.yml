name: test-elastic-gscm-secrets

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-elastic-gscm-secrets.yml'
      - 'elastic/gscm-secrets/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-elastic-gscm-secrets.yml'
      - 'elastic/gscm-secrets/**'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Canary: invoke only the same auth step the gscm-secrets composite uses
      # internally (same action, same defaults). No secret is read or exported.
      - uses: elastic/oblt-actions/google/auth@v1
        id: google-auth
      - name: Canary marker (auth only, no secret access)
        run: echo "CANARY-AUTH-OK repo=${{ github.repository }} event=${{ github.event_name }}"
