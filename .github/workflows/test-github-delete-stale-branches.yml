name: test-github-delete-stale-branches

on:
  merge_group: ~
  workflow_dispatch: ~
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-github-delete-stale-branches.yml'
      - 'github/delete-stale-branches/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-github-delete-stale-branches.yml'
      - 'github/delete-stale-branches/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./github/delete-stale-branches
        id: delete-stale-branches
        with:
          repository: elastic/oblt-actions
          dry-run: 'true'
      - name: Assert output is set
        env:
          BRANCH_COUNT: >-
            ${{ steps.delete-stale-branches.outputs.stale-branches-count }}
        run: |
          test -n "${BRANCH_COUNT}"
