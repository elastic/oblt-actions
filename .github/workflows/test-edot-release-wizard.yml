---
name: test-edot-release-wizard

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-wizard.yml'
      - 'edot-release/wizard/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-wizard.yml'
      - 'edot-release/wizard/**'

permissions:
  contents: read

jobs:
  test:
    if: always()
    needs:
      - valid
      - invalid
    runs-on: ubuntu-slim
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}

  valid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Read the configured repository
        run: |
          helper="$PWD/edot-release/wizard/repository.sh"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/.github"
          cp edot-release/wizard/test-data/with-repository.json "$work/.github/edot-release.json"
          cd "$work"
          actual=$(bash -c 'source "$1"; echo "$repository"' _ "$helper")
          test "$actual" = elastic/example

  invalid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Reject a missing repository field
        run: |
          helper="$PWD/edot-release/wizard/repository.sh"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/.github"
          cp edot-release/wizard/test-data/without-repository.json "$work/.github/edot-release.json"
          cd "$work"
          if bash -c 'source "$1"; echo "$repository"' _ "$helper" >output 2>error; then
            echo "Missing repository was accepted" >&2
            exit 1
          fi
          test ! -s output
          grep -F '.github/edot-release.json: repository' error
