---
name: test-edot-release-prepare-start

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-prepare-start.yml'
      - 'edot-release/prepare-start/**'
      - 'edot-release/version/**'
      - 'edot-release/pr-range/**'
      - 'edot-release/render-release-notes/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-prepare-start.yml'
      - 'edot-release/prepare-start/**'
      - 'edot-release/version/**'
      - 'edot-release/pr-range/**'
      - 'edot-release/render-release-notes/**'

permissions:
  contents: read
  pull-requests: read

# The fixture repository is built at the workspace root by
# edot-release/prepare-start/test-data/fixture.sh, next to this checkout in
# oblt-actions/. Each fixture commit carries a cherry-pick trailer that
# pr-range resolves through the case's repository:
#   elastic/apm-agent-android 4da20136c2519785c63247bb20e7d383fab20528 is PR #922
#   elastic/apm-agent-ios ff10c291ca210ccdf26ab86ad44ff5b910fa0d21 is PR #395
#   elastic/oblt-actions 4967b69e2f83588d572e721c4f34928b51ab003e is PR #1135
env:
  FIXTURE: oblt-actions/edot-release/prepare-start/test-data/fixture.sh
  TEST_DATA: oblt-actions/edot-release/prepare-start/test-data
  ANDROID_VERSION_REGEX: '^version=(.*)$'
  IOS_VERSION_REGEX: '^  public static let elasticSwiftAgentVersion: String = "([^"]*)"$'

jobs:
  test:
    if: always()
    needs:
      - valid
      - invalid
    runs-on: ubuntu-slim
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}

  valid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      - id: notes
        name: Read release-note fixtures
        run: |
          data=oblt-actions/edot-release/render-release-notes/test-data
          {
            echo "android=$(jq -c . "$data/android-1.10.0.json")"
            echo "ios=$(jq -c . "$data/ios-sample.json")"
          } >> "$GITHUB_OUTPUT"

      # Android 1.10.0, the first release of this flow: the inputs are the
      # parent of the merged preparation PR #923 and the expected files are
      # that PR's merge commit.
      - name: Create Android fixture
        run: '"$FIXTURE" create android 1.10.0-SNAPSHOT v1.9.0 4da20136c2519785c63247bb20e7d383fab20528'

      - id: android
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.android }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/apm-agent-android

      - name: Verify Android release changes
        env:
          PREPARED: ${{ steps.android.outputs.prepared }}
          VERSION: ${{ steps.android.outputs.version }}
          BUMP: ${{ steps.android.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.android.outputs.previous-tag }}
          RELEASE_BRANCH: ${{ steps.android.outputs.release-branch }}
          PREPARE_BRANCH: ${{ steps.android.outputs.prepare-branch }}
          RANGE: ${{ steps.android.outputs.range }}
        run: |
          "$FIXTURE" compare gradle.properties "$TEST_DATA/android/expected-gradle.properties"
          "$FIXTURE" compare docs/release-notes/index.md "$TEST_DATA/android/expected-index.md"
          "$FIXTURE" compare docs/reference/applies-to.md "$TEST_DATA/android/applies-to.md"
          test "$PREPARED" = true
          test "$VERSION" = 1.10.0
          test "$BUMP" = minor
          test "$PREVIOUS_TAG" = v1.9.0
          test "$RELEASE_BRANCH" = releasing/1.10.0
          test "$PREPARE_BRANCH" = prepare/1.10.0
          jq -e '.previousTag == "v1.9.0" and (.pullRequests | map(.number) == [922])' <<<"$RANGE"

      # iOS: a breaking item makes 2.2.0-SNAPSHOT release as 3.0.0, so the
      # applies_to entry written against 2.2.0 is rewritten.
      - name: Create iOS fixture
        run: '"$FIXTURE" create ios 2.2.0-SNAPSHOT 2.1.0 ff10c291ca210ccdf26ab86ad44ff5b910fa0d21'

      - id: ios
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.ios }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-
          subsection-anchor-prefix: elastic-apm-ios-agent-
          applies-to-key: edot_ios
          version-file: Sources/apm-agent-ios/Version.swift
          version-regex: ${{ env.IOS_VERSION_REGEX }}
          repository: elastic/apm-agent-ios

      - name: Verify iOS release changes
        env:
          PREPARED: ${{ steps.ios.outputs.prepared }}
          VERSION: ${{ steps.ios.outputs.version }}
          BUMP: ${{ steps.ios.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.ios.outputs.previous-tag }}
          RELEASE_BRANCH: ${{ steps.ios.outputs.release-branch }}
          PREPARE_BRANCH: ${{ steps.ios.outputs.prepare-branch }}
          RANGE: ${{ steps.ios.outputs.range }}
        run: |
          "$FIXTURE" compare Sources/apm-agent-ios/Version.swift "$TEST_DATA/ios/expected-Version.swift"
          "$FIXTURE" compare docs/release-notes/index.md "$TEST_DATA/ios/expected-index.md"
          "$FIXTURE" compare docs/reference/applies-to.md "$TEST_DATA/ios/expected-applies-to.md"
          test "$PREPARED" = true
          test "$VERSION" = 3.0.0
          test "$BUMP" = major
          test "$PREVIOUS_TAG" = 2.1.0
          test "$RELEASE_BRANCH" = releasing/3.0.0
          test "$PREPARE_BRANCH" = prepare/3.0.0
          jq -e '.previousTag == "2.1.0" and (.pullRequests | map(.number) == [395])' <<<"$RANGE"

      # Android patch: the version comes from the branch name, the previous
      # tag is the same line one patch lower, and applies_to stays.
      - name: Create Android patch fixture
        run: '"$FIXTURE" create android 1.10.0 v1.10.0 4da20136c2519785c63247bb20e7d383fab20528'

      - id: patch
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.android }}
          ref: HEAD
          ref-name: patching/1.10.1
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/apm-agent-android

      - name: Verify Android patch release changes
        env:
          PREPARED: ${{ steps.patch.outputs.prepared }}
          VERSION: ${{ steps.patch.outputs.version }}
          BUMP: ${{ steps.patch.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.patch.outputs.previous-tag }}
          RELEASE_BRANCH: ${{ steps.patch.outputs.release-branch }}
          PREPARE_BRANCH: ${{ steps.patch.outputs.prepare-branch }}
          RANGE: ${{ steps.patch.outputs.range }}
        run: |
          grep -Fx 'version=1.10.1' gradle.properties
          "$FIXTURE" compare docs/reference/applies-to.md "$TEST_DATA/android/applies-to.md"
          test "$(grep -Fx -A1 '% next_release_notes' docs/release-notes/index.md | tail -n 1)" \
            = '## 1.10.1 [elastic-apm-android-agent-1101-release-notes]'
          test "$PREPARED" = true
          test "$VERSION" = 1.10.1
          test "$BUMP" = minor
          test "$PREVIOUS_TAG" = v1.10.0
          test "$RELEASE_BRANCH" = releasing/1.10.1
          test "$PREPARE_BRANCH" = prepare/1.10.1
          jq -e '.previousTag == "v1.10.0" and (.pullRequests | map(.number) == [922])' <<<"$RANGE"

      # Nothing merged since the tag: a successful no-op that writes nothing.
      - name: Create no-op fixture
        run: '"$FIXTURE" create android 1.10.0-SNAPSHOT v1.9.0'

      - id: no-op
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.android }}
          ref: v1.9.0
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions

      - name: Verify no-op
        env:
          PREPARED: ${{ steps.no-op.outputs.prepared }}
          VERSION: ${{ steps.no-op.outputs.version }}
          PREVIOUS_TAG: ${{ steps.no-op.outputs.previous-tag }}
          RANGE: ${{ steps.no-op.outputs.range }}
        run: |
          "$FIXTURE" check-unchanged
          test "$PREPARED" = false
          test -z "$VERSION"
          test "$PREVIOUS_TAG" = v1.9.0
          jq -e '.pullRequests == []' <<<"$RANGE"

  invalid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      - id: notes
        name: Read release-note fixtures
        run: |
          data=oblt-actions/edot-release/render-release-notes/test-data
          {
            echo "minor=$(jq -c . "$data/android-1.10.0.json")"
            echo "major=$(jq -c . "$data/ios-sample.json")"
            echo "uncategorized=$(jq -c '.uncategorized = [{"message":"Classify me"}]' "$data/android-1.10.0.json")"
            echo "prefixed-breaking=$(jq -c '.featuresEnhancements[0].message = "[Breaking] Duplicate signal"' "$data/android-1.10.0.json")"
          } >> "$GITHUB_OUTPUT"

      # Every case below starts from v98.0.0 with 98.1.0-SNAPSHOT, unless it
      # says otherwise, and checks that the rejection wrote nothing.
      - name: Create fixture for a ref outside main and patching
        run: '"$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0 4967b69e2f83588d572e721c4f34928b51ab003e'
      - id: feature-ref
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.major }}
          ref: HEAD
          ref-name: feature/x
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.feature-ref.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture with a release in flight
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0 4967b69e2f83588d572e721c4f34928b51ab003e
          git push --quiet origin HEAD:refs/heads/releasing/99.0.0
          "$FIXTURE" snapshot
      - id: in-flight
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.major }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.in-flight.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture with an unexpected development version
        run: '"$FIXTURE" create android 98.2.0-SNAPSHOT v98.0.0 4967b69e2f83588d572e721c4f34928b51ab003e'
      - id: development-version
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.minor }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.development-version.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture for notes with uncategorized items
        run: '"$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0 4967b69e2f83588d572e721c4f34928b51ab003e'
      - id: uncategorized
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.uncategorized }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.uncategorized.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture for a message with a Breaking prefix
        run: '"$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0 4967b69e2f83588d572e721c4f34928b51ab003e'
      - id: prefixed-breaking
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.prefixed-breaking }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.prefixed-breaking.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture for notes that are not JSON
        run: '"$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0 4967b69e2f83588d572e721c4f34928b51ab003e'
      - id: invalid-json
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: '{"dependencies": ['
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.invalid-json.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture whose index already has the release
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          "$FIXTURE" add-section 99.0.0
          "$FIXTURE" commit 'Fixture change' 4967b69e2f83588d572e721c4f34928b51ab003e
          git push --quiet origin HEAD:refs/heads/main
          "$FIXTURE" snapshot
      - id: existing-heading
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.major }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.existing-heading.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture for a patch that is already released
        run: |
          "$FIXTURE" create android 99.0.0 v99.0.0 4967b69e2f83588d572e721c4f34928b51ab003e
          git tag v99.0.1
          git push --quiet origin refs/tags/v99.0.1:refs/tags/v99.0.1
          "$FIXTURE" snapshot
      - id: released-patch
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.minor }}
          ref: HEAD
          ref-name: patching/99.0.1
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.released-patch.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture for a breaking item on a patch branch
        run: '"$FIXTURE" create android 99.0.0 v99.0.0 4967b69e2f83588d572e721c4f34928b51ab003e'
      - id: breaking-patch
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.major }}
          ref: HEAD
          ref-name: patching/99.0.1
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.breaking-patch.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - name: Create fixture with two version lines
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          "$FIXTURE" duplicate-version-line
          "$FIXTURE" commit 'Fixture change' 4967b69e2f83588d572e721c4f34928b51ab003e
          git push --quiet origin HEAD:refs/heads/main
          "$FIXTURE" snapshot
      - id: two-version-lines
        continue-on-error: true
        uses: ./oblt-actions/edot-release/prepare-start
        with:
          notes: ${{ steps.notes.outputs.minor }}
          ref: HEAD
          ref-name: main
          heading-anchor-prefix: elastic-apm-android-agent-
          subsection-anchor-prefix: elastic-apm-android-agent-
          applies-to-key: edot_android
          tag-prefix: v
          version-file: gradle.properties
          version-regex: ${{ env.ANDROID_VERSION_REGEX }}
          repository: elastic/oblt-actions
      - if: steps.two-version-lines.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'
