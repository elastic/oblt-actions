---
name: test-edot-release-start-patch

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-start-patch.yml'
      - 'edot-release/start-patch/**'
      - 'edot-release/prepare-start/**'
      - 'edot-release/version/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-start-patch.yml'
      - 'edot-release/start-patch/**'
      - 'edot-release/prepare-start/**'
      - 'edot-release/version/**'

permissions:
  contents: read
  pull-requests: read

# The fixture repository is built at the workspace root by
# edot-release/prepare-start/test-data/fixture.sh, next to this checkout in
# oblt-actions/. The cherry-picked commits are real merged pull requests of
# this repository, and of elastic/apm-agent-android for a merge commit with
# two parents, imported into the fixture by SHA. The versions are 99.x so
# that the existence checks, which read this repository, cannot find one of
# its own branches.
#
# The steps that run start-patch.sh directly, to read its printout or its
# message, get the environment action.yml maps: the values below, plus LINE
# and PULL_REQUESTS, and their own value where a case differs.
env:
  FIXTURE: oblt-actions/edot-release/prepare-start/test-data/fixture.sh
  START_PATCH: oblt-actions/edot-release/start-patch/start-patch.sh
  RELEASE_REF_NAME: main
  DRY_RUN: 'true'
  RELEASE_REPOSITORY: elastic/oblt-actions
  GH_TOKEN: ${{ github.token }}

jobs:
  test:
    if: always()
    needs:
      - valid
      - invalid
    runs-on: ubuntu-slim
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}

  valid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      # Releases 99.0.0, 99.0.1, and 99.1.0, so line 99.0 resolves v99.0.1.
      - name: Create Android fixture
        run: |
          "$FIXTURE" create android 99.1.0-SNAPSHOT v99.0.0
          "$FIXTURE" commit 'Release v99.0.1' > /dev/null
          git tag v99.0.1
          "$FIXTURE" commit 'Release v99.1.0' > /dev/null
          git tag v99.1.0
          git push --quiet origin refs/heads/main:refs/heads/main refs/tags/v99.0.1:refs/tags/v99.0.1 refs/tags/v99.1.0:refs/tags/v99.1.0
          "$FIXTURE" import elastic/oblt-actions 0bf75aa4fb29817e23c3e3071d3a19fbce85b016
          "$FIXTURE" import elastic/oblt-actions 2d7b24596909615fbe09e96c23143379a243ec1f
          "$FIXTURE" snapshot

      # #1137 is listed first but merged after #527.
      - id: picks
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '#1137, 527'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions

      - name: Verify picks dry-run
        env:
          BRANCH: ${{ steps.picks.outputs.branch }}
          SOURCE_TAG: ${{ steps.picks.outputs.source-tag }}
          VERSION: ${{ steps.picks.outputs.version }}
          APPLIED: ${{ steps.picks.outputs.pull-requests }}
          LINE: '99.0'
          PULL_REQUESTS: '#1137, 527'
        run: |
          test "$BRANCH" = patching/99.0.2
          test "$SOURCE_TAG" = v99.0.1
          test "$VERSION" = 99.0.2
          test "$APPLIED" = '527 1137'
          "$FIXTURE" check-unchanged
          log="$RUNNER_TEMP/picks.log"
          "$START_PATCH" > "$log"
          cat "$log"
          "$FIXTURE" check-unchanged
          test "$(grep -c '^Would run:' "$log")" = 1
          push=$(grep -Ex 'Would run: git push origin [0-9a-f]{40}:refs/heads/patching/99\.0\.2' "$log")
          commit=$(sed -E 's/^Would run: git push origin ([0-9a-f]{40}):.*/\1/' <<< "$push")
          test "$(git log -1 --format=%B "$commit" | sed '/^$/d' | tail -n 1)" = '(cherry picked from commit 2d7b24596909615fbe09e96c23143379a243ec1f)'
          test "$(git log -1 --format=%B "$commit~1" | sed '/^$/d' | tail -n 1)" = '(cherry picked from commit 0bf75aa4fb29817e23c3e3071d3a19fbce85b016)'
          test "$(git rev-parse "$commit~2")" = "$(git rev-parse 'v99.0.1^{commit}')"

      # iOS tags carry no prefix. Release 99.0.0 only, and no pull request.
      - name: Create iOS fixture
        run: '"$FIXTURE" create ios 99.1.0-SNAPSHOT 99.0.0'

      - id: no-picks
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions

      - name: Verify no-picks dry-run
        env:
          BRANCH: ${{ steps.no-picks.outputs.branch }}
          SOURCE_TAG: ${{ steps.no-picks.outputs.source-tag }}
          VERSION: ${{ steps.no-picks.outputs.version }}
          APPLIED: ${{ steps.no-picks.outputs.pull-requests }}
          LINE: '99.0'
          PULL_REQUESTS: ''
        run: |
          test "$BRANCH" = patching/99.0.1
          test "$SOURCE_TAG" = 99.0.0
          test "$VERSION" = 99.0.1
          test -z "$APPLIED"
          "$FIXTURE" check-unchanged
          log="$RUNNER_TEMP/no-picks.log"
          "$START_PATCH" > "$log"
          cat "$log"
          "$FIXTURE" check-unchanged
          test "$(grep -c '^Would run:' "$log")" = 1
          grep -Fx "Would run: git push origin $(git rev-parse '99.0.0^{commit}'):refs/heads/patching/99.0.1" "$log"

      - name: Verify nothing was created on GitHub
        run: '"$FIXTURE" check-upstream elastic/oblt-actions 99.0.1 99.0.2'

  invalid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      # Line 99.0 resolves v99.0.1 and patching/99.0.2. v99.2.0 is on a side
      # commit without the release configuration, as a release cut before
      # the release automation would be.
      - name: Create fixture
        run: |
          "$FIXTURE" create android 99.1.0-SNAPSHOT v99.0.0
          "$FIXTURE" commit 'Release v99.0.1' > /dev/null
          git tag v99.0.1
          "$FIXTURE" commit 'Release v99.1.0' > /dev/null
          git tag v99.1.0
          git switch --quiet --detach
          git rm --quiet .github/edot-release.json
          "$FIXTURE" commit 'Release v99.2.0' > /dev/null
          git tag v99.2.0
          git switch --quiet main
          git push --quiet origin refs/heads/main:refs/heads/main 'refs/tags/*:refs/tags/*'
          "$FIXTURE" import elastic/oblt-actions 0bf75aa4fb29817e23c3e3071d3a19fbce85b016
          "$FIXTURE" import elastic/oblt-actions 4967b69e2f83588d572e721c4f34928b51ab003e
          "$FIXTURE" import elastic/apm-agent-android e20e7f4a0ee426956e0101fe9959b27647a11353
          "$FIXTURE" snapshot

      - id: other-ref
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          ref-name: patching/99.0.2
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.other-ref.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          RELEASE_REF_NAME: patching/99.0.2
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx "Start patch runs from main, not 'patching/99.0.2'." "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      # Without its own check, an empty line would select the highest tag of
      # every line.
      - id: empty-line
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: ''
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.empty-line.outcome != 'failure'
        run: exit 1
      - env:
          LINE: ''
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'line is required; expected X.Y.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      - id: short-line
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.short-line.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx "Invalid release line '99'; expected X.Y." "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      - id: unknown-line
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '98.0'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.unknown-line.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '98.0'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'No release exists on line 98.0.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      - id: manual-release
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.2'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.manual-release.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.2'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'v99.2.0 predates the automated release process; patch this release by hand.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      - id: malformed-pull-request
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '12a'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.malformed-pull-request.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          PULL_REQUESTS: '12a'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx "Invalid pull request '12a'; expected numbers separated by spaces or commas." "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      # #1094 was closed without merging.
      - id: unmerged
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '#1094'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.unmerged.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          PULL_REQUESTS: '#1094'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'Pull request #1094 must be merged into main in elastic/oblt-actions.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      # #472 was merged into another branch.
      - id: other-base
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '#472'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.other-base.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          PULL_REQUESTS: '#472'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'Pull request #472 must be merged into main in elastic/oblt-actions.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      # #7 of elastic/apm-agent-android was merged with a merge commit.
      - id: two-parents
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '7'
          ref-name: main
          dry-run: true
          repository: elastic/apm-agent-android
      - if: steps.two-parents.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          PULL_REQUESTS: '7'
          RELEASE_REPOSITORY: elastic/apm-agent-android
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'Pull request #7 was not squash-merged: its merge commit e20e7f4a0ee426956e0101fe9959b27647a11353 has more than one parent. Dispatch again without #7, then cherry-pick it by hand through a pull request into patching/99.0.2. Nothing was pushed.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      # #527 picks cleanly first; #1135 changes files the fixture does not
      # have.
      - id: conflict
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '1135 527'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.conflict.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          PULL_REQUESTS: '1135 527'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" > "$RUNNER_TEMP/output.log" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/output.log" "$RUNNER_TEMP/error.log"
          grep -Fx 'Cherry-pick for pull request #1135 conflicted. Dispatch again without #1135, then cherry-pick it by hand through a pull request into patching/99.0.2. Nothing was pushed.' "$RUNNER_TEMP/error.log"
          if grep '^Would run:' "$RUNNER_TEMP/output.log"; then exit 1; fi
          "$FIXTURE" check-unchanged

      # The second pick of the same pull request is empty.
      - id: repeated
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          pull-requests: '527 527'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.repeated.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
          PULL_REQUESTS: '527 527'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'Cherry-pick for pull request #527 conflicted. Dispatch again without #527, then cherry-pick it by hand through a pull request into patching/99.0.2. Nothing was pushed.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged

      # Last, because every line 99.0 case above needs patching/99.0.2 absent.
      - name: Create the patch branch on the fixture origin
        run: |
          "$FIXTURE" remote-branch patching/99.0.2
          "$FIXTURE" snapshot
      - id: existing-branch
        continue-on-error: true
        uses: ./oblt-actions/edot-release/start-patch
        with:
          line: '99.0'
          ref-name: main
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.existing-branch.outcome != 'failure'
        run: exit 1
      - env:
          LINE: '99.0'
        run: |
          "$FIXTURE" check-unchanged
          if "$START_PATCH" 2> "$RUNNER_TEMP/error.log"; then exit 1; fi
          cat "$RUNNER_TEMP/error.log"
          grep -Fx 'patching/99.0.2 already exists; cherry-pick further fixes by hand through pull requests into that branch.' "$RUNNER_TEMP/error.log"
          "$FIXTURE" check-unchanged
