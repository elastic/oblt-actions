---
name: test-edot-release-draft-release-notes

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-draft-release-notes.yml'
      - 'edot-release/draft-release-notes/**'
      - 'edot-release/pr-range/**'
      - 'edot-release/version/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-draft-release-notes.yml'
      - 'edot-release/draft-release-notes/**'
      - 'edot-release/pr-range/**'
      - 'edot-release/version/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: always()
    needs:
      - valid
      - grouping
      - invalid
    runs-on: ubuntu-slim
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}

  valid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: notes
        uses: ./edot-release/draft-release-notes
        with:
          ref: v1.41.3
          ref-name: main
          previous-tag: v1.41.2
          tag-prefix: v
          repository: elastic/oblt-actions

      - name: Create literal ref fixture
        run: git branch "edot-release-literal-\$value" v1.41.3

      - id: literal-ref
        uses: ./edot-release/draft-release-notes
        with:
          ref: edot-release-literal-$value
          ref-name: main
          previous-tag: v1.41.2
          tag-prefix: v
          repository: elastic/oblt-actions

      - name: Verify notes
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
          LITERAL_NOTES: ${{ steps.literal-ref.outputs.notes }}
        run: |
          for notes in "$NOTES" "$LITERAL_NOTES"; do
            jq -e '
              (.dependencies | length) == 0
              and (.featuresEnhancements | length) == 0
              and (.fixes | length) == 0
              and (.uncategorized | map(.prId) == ["1135"])
            ' <<<"$notes"
          done

  grouping:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: |
          jq -f edot-release/draft-release-notes/group.jq \
            edot-release/draft-release-notes/test-data/range.json \
            > "$RUNNER_TEMP/notes.json"
          diff "$RUNNER_TEMP/notes.json" \
            edot-release/draft-release-notes/test-data/notes.json

  invalid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: missing-tag
        continue-on-error: true
        uses: ./edot-release/draft-release-notes
        with:
          ref: v1.41.3
          ref-name: main
          previous-tag: v0.0.0-missing
          tag-prefix: v
          repository: elastic/oblt-actions

      - if: steps.missing-tag.outcome != 'failure'
        run: exit 1
