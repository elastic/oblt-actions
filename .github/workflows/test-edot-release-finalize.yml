---
name: test-edot-release-finalize

on:
  merge_group: ~
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-finalize.yml'
      - 'edot-release/finalize/**'
      - 'edot-release/prepare-start/**'
      - 'edot-release/version/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-edot-release-finalize.yml'
      - 'edot-release/finalize/**'
      - 'edot-release/prepare-start/**'
      - 'edot-release/version/**'

permissions:
  contents: read
  pull-requests: read

# The fixture repository is built at the workspace root by
# edot-release/prepare-start/test-data/fixture.sh, next to this checkout in
# oblt-actions/, with the Android .github/edot-release.json. The versions
# are 99.x so that the Release and pull request existence checks, which read
# this repository, cannot find one of its own v1.x tags or Releases.
env:
  FIXTURE: oblt-actions/edot-release/prepare-start/test-data/fixture.sh

jobs:
  test:
    if: always()
    needs:
      - valid
      - invalid
    runs-on: ubuntu-slim
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}

  valid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      # 99.0.0 merged from prepare/99.0.0 into releasing/99.0.0 and not yet
      # tagged.
      - id: main-fixture
        name: Create main release fixture
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          git switch --quiet -c releasing/99.0.0
          "$FIXTURE" set-version 99.0.0
          "$FIXTURE" add-section 99.0.0
          sha=$("$FIXTURE" commit 'Prepare release 99.0.0')
          git push --quiet origin \
            refs/heads/releasing/99.0.0:refs/heads/releasing/99.0.0 \
            refs/heads/releasing/99.0.0:refs/heads/prepare/99.0.0
          "$FIXTURE" snapshot
          {
            echo "sha=$sha"
            echo "release=$(jq -c -n --arg sha "$sha" '{sha: $sha, version: "99.0.0", baseRef: "releasing/99.0.0", tagExists: false}')"
          } >> "$GITHUB_OUTPUT"

      - id: main
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: ${{ steps.main-fixture.outputs.release }}
          dry-run: true
          repository: elastic/oblt-actions

      - name: Verify main dry-run
        env:
          RELEASE_URL: ${{ steps.main.outputs.release-url }}
          MAIN_PULL_REQUEST_URL: ${{ steps.main.outputs.main-pull-request-url }}
          RELEASE_SHA: ${{ steps.main-fixture.outputs.sha }}
          # The environment main received from action.yml, for a direct
          # run whose printout the assertions read.
          RELEASE_JSON: ${{ steps.main-fixture.outputs.release }}
          DRY_RUN: 'true'
          RELEASE_REPOSITORY: elastic/oblt-actions
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$RELEASE_URL"
          test -z "$MAIN_PULL_REQUEST_URL"
          "$FIXTURE" check-unchanged
          log="$RUNNER_TEMP/main.log"
          oblt-actions/edot-release/finalize/finalize.sh > "$log"
          cat "$log"
          "$FIXTURE" check-unchanged
          grep -Fx "Would run: git tag v99.0.0 $RELEASE_SHA" "$log"
          grep -Fx 'Would run: git push origin refs/tags/v99.0.0:refs/tags/v99.0.0' "$log"
          grep -F 'Would run: gh release create v99.0.0 --repo elastic/oblt-actions --verify-tag --title EDOT\ Android\ 99.0.0 --notes-file ' "$log"
          grep -Fx '[Published documentation](https://www.elastic.co/docs/release-notes/edot/sdks/android#elastic-apm-android-agent-9900-release-notes)' "$log"
          grep -Fx "Would run: git switch -C releasing/99.0.0 $RELEASE_SHA" "$log"
          grep -Ex 'Would run: .*/prepare-start/version-file\.sh write 99\.1\.0-SNAPSHOT' "$log"
          grep -Fx 'Would run: git add -- gradle.properties' "$log"
          grep -Fx 'Would run: git commit -m Prepare\ for\ the\ next\ release' "$log"
          grep -Fx 'Would run: git push origin HEAD:refs/heads/releasing/99.0.0' "$log"
          grep -F 'Would run: gh pr create --repo elastic/oblt-actions --base main --head releasing/99.0.0 --title Release\ 99.0.0 --body-file ' "$log"
          grep -Fx 'EDOT Android 99.0.0 is published: [v99.0.0](https://github.com/elastic/oblt-actions/releases/tag/v99.0.0), [GitHub Release](<release-url>).' "$log"
          grep -Fx 'Would run: git push origin --delete prepare/99.0.0' "$log"
          if grep -F 'Would run: git push origin --delete releasing/' "$log"; then
            exit 1
          fi

      # A previous run tagged 99.0.0 and committed the next development
      # version on releasing/99.0.0, then failed.
      - id: resumed-fixture
        name: Create resumed release fixture
        env:
          SHA: ${{ steps.main-fixture.outputs.sha }}
        run: |
          git tag v99.0.0 "$SHA"
          "$FIXTURE" set-version 99.1.0-SNAPSHOT
          "$FIXTURE" commit 'Prepare for the next release' > /dev/null
          git push --quiet origin \
            refs/heads/releasing/99.0.0:refs/heads/releasing/99.0.0 \
            refs/tags/v99.0.0:refs/tags/v99.0.0
          "$FIXTURE" snapshot
          echo "release=$(jq -c -n --arg sha "$SHA" '{sha: $sha, version: "99.0.0", baseRef: "releasing/99.0.0", tagExists: true}')" >> "$GITHUB_OUTPUT"

      - id: resumed
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: ${{ steps.resumed-fixture.outputs.release }}
          dry-run: true
          repository: elastic/oblt-actions

      - name: Verify resumed dry-run
        env:
          RELEASE_URL: ${{ steps.resumed.outputs.release-url }}
          MAIN_PULL_REQUEST_URL: ${{ steps.resumed.outputs.main-pull-request-url }}
          RELEASE_SHA: ${{ steps.main-fixture.outputs.sha }}
          # The environment resumed received from action.yml, for a direct
          # run whose printout the assertions read.
          RELEASE_JSON: ${{ steps.resumed-fixture.outputs.release }}
          DRY_RUN: 'true'
          RELEASE_REPOSITORY: elastic/oblt-actions
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$RELEASE_URL"
          test -z "$MAIN_PULL_REQUEST_URL"
          "$FIXTURE" check-unchanged
          log="$RUNNER_TEMP/resumed.log"
          oblt-actions/edot-release/finalize/finalize.sh > "$log"
          cat "$log"
          "$FIXTURE" check-unchanged
          if grep -E 'Would run: git (tag|commit)' "$log"; then
            exit 1
          fi
          grep -Fx 'releasing/99.0.0 already carries the next development version.' "$log"
          grep -F 'Would run: gh release create v99.0.0 --repo elastic/oblt-actions --verify-tag --title EDOT\ Android\ 99.0.0 --notes-file ' "$log"
          grep -F 'Would run: gh pr create --repo elastic/oblt-actions --base main --head releasing/99.0.0 --title Release\ 99.0.0 --body-file ' "$log"

      # 99.0.1 merged into releasing/99.0.1, cut from v99.0.0; main already
      # carries the 99.0.0 notes, under which the 99.0.1 section belongs.
      - id: patch-fixture
        name: Create patch release fixture
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          "$FIXTURE" set-version 99.0.0
          "$FIXTURE" add-section 99.0.0
          "$FIXTURE" commit 'Prepare release 99.0.0' > /dev/null
          git tag v99.0.0
          "$FIXTURE" set-version 99.1.0-SNAPSHOT
          "$FIXTURE" commit 'Prepare for the next release' > /dev/null
          git switch --quiet -c releasing/99.0.1 v99.0.0
          "$FIXTURE" set-version 99.0.1
          "$FIXTURE" add-section 99.0.1
          sha=$("$FIXTURE" commit 'Prepare release 99.0.1')
          # No patching/99.0.1 on origin, as after a run that deleted it.
          git push --quiet origin \
            refs/heads/main:refs/heads/main \
            refs/heads/releasing/99.0.1:refs/heads/releasing/99.0.1 \
            refs/heads/releasing/99.0.1:refs/heads/prepare/99.0.1 \
            refs/tags/v99.0.0:refs/tags/v99.0.0
          "$FIXTURE" snapshot
          {
            echo "sha=$sha"
            echo "release=$(jq -c -n --arg sha "$sha" '{sha: $sha, version: "99.0.1", baseRef: "releasing/99.0.1", tagExists: false}')"
          } >> "$GITHUB_OUTPUT"

      - id: patch
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: ${{ steps.patch-fixture.outputs.release }}
          dry-run: true
          repository: elastic/oblt-actions

      - name: Verify patch dry-run
        env:
          RELEASE_URL: ${{ steps.patch.outputs.release-url }}
          MAIN_PULL_REQUEST_URL: ${{ steps.patch.outputs.main-pull-request-url }}
          RELEASE_SHA: ${{ steps.patch-fixture.outputs.sha }}
          # The environment patch received from action.yml, for a direct
          # run whose printout the assertions read.
          RELEASE_JSON: ${{ steps.patch-fixture.outputs.release }}
          DRY_RUN: 'true'
          RELEASE_REPOSITORY: elastic/oblt-actions
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$RELEASE_URL"
          test -z "$MAIN_PULL_REQUEST_URL"
          "$FIXTURE" check-unchanged
          log="$RUNNER_TEMP/patch.log"
          oblt-actions/edot-release/finalize/finalize.sh > "$log"
          cat "$log"
          "$FIXTURE" check-unchanged
          grep -Fx "Would run: git tag v99.0.1 $RELEASE_SHA" "$log"
          grep -Fx 'Would run: git push origin refs/tags/v99.0.1:refs/tags/v99.0.1' "$log"
          grep -F 'Would run: gh release create v99.0.1 --repo elastic/oblt-actions --verify-tag --title EDOT\ Android\ 99.0.1 --notes-file ' "$log"
          if grep -F 'version-file.sh write' "$log"; then
            exit 1
          fi
          grep -Fx 'Would run: git switch -C patch-notes/99.0.1 refs/remotes/origin/main' "$log"
          grep -Fx 'Would run: git commit -m Add\ 99.0.1\ release\ notes' "$log"
          grep -Fx 'Would run: git push origin HEAD:refs/heads/patch-notes/99.0.1' "$log"
          grep -F 'Would run: gh pr create --repo elastic/oblt-actions --base main --head patch-notes/99.0.1 --title Release\ notes\ for\ 99.0.1 --body-file ' "$log"
          grep -Fx 'Merging this pull request publishes the release notes on the documentation site.' "$log"
          grep -Fx 'Would run: git push origin --delete prepare/99.0.1' "$log"
          grep -Fx 'Would run: git push origin --delete releasing/99.0.1' "$log"
          grep -Fx 'patching/99.0.1 is already deleted.' "$log"
          if grep -F 'Would run: git push origin --delete patching/' "$log"; then
            exit 1
          fi

      - name: Verify nothing was created on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$FIXTURE" check-upstream elastic/oblt-actions 99.0.0 99.0.1'

  invalid:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          path: oblt-actions

      # A 99.0.0 release whose releasing branch gained an unrelated commit,
      # a 99.0.1 release whose notes main already carries, and a 99.0.2
      # release that only a failed pull request lookup stops.
      - id: fixture
        name: Create fixture
        run: |
          "$FIXTURE" create android 98.1.0-SNAPSHOT v98.0.0
          "$FIXTURE" add-section 99.0.1
          "$FIXTURE" commit 'Notes for 99.0.1 without their pull request' > /dev/null
          git switch --quiet -c releasing/99.0.0 v98.0.0
          "$FIXTURE" set-version 99.0.0
          "$FIXTURE" add-section 99.0.0
          release=$("$FIXTURE" commit 'Prepare release 99.0.0')
          git tag v99.0.0
          echo unrelated > docs/unrelated.md
          "$FIXTURE" commit 'Unrelated change' > /dev/null
          git switch --quiet -c releasing/99.0.1 v99.0.0
          "$FIXTURE" set-version 99.0.1
          "$FIXTURE" add-section 99.0.1
          patch=$("$FIXTURE" commit 'Prepare release 99.0.1')
          git switch --quiet -c releasing/99.0.2 v99.0.0
          "$FIXTURE" set-version 99.0.2
          "$FIXTURE" add-section 99.0.2
          lookup=$("$FIXTURE" commit 'Prepare release 99.0.2')
          git push --quiet origin \
            refs/heads/main:refs/heads/main \
            refs/heads/releasing/99.0.0:refs/heads/releasing/99.0.0 \
            refs/heads/releasing/99.0.1:refs/heads/releasing/99.0.1 \
            refs/heads/releasing/99.0.2:refs/heads/releasing/99.0.2 \
            refs/tags/v99.0.0:refs/tags/v99.0.0
          "$FIXTURE" snapshot
          {
            echo "release=$release"
            echo "patch=$patch"
            echo "lookup=$lookup"
          } >> "$GITHUB_OUTPUT"

      - name: Abbreviate the release commit
        id: short
        env:
          RELEASE: ${{ steps.fixture.outputs.release }}
        run: echo "sha=${RELEASE:0:12}" >> "$GITHUB_OUTPUT"
      - id: short-sha
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.short.outputs.sha }}", "version": "99.0.0", "baseRef": "releasing/99.0.0", "tagExists": true}'
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.short-sha.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: short-version
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.fixture.outputs.release }}", "version": "99.0", "baseRef": "releasing/99.0", "tagExists": true}'
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.short-version.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: tag-exists-yes
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.fixture.outputs.release }}", "version": "99.0.0", "baseRef": "releasing/99.0.0", "tagExists": "yes"}'
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.tag-exists-yes.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: other-base
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.fixture.outputs.release }}", "version": "99.0.0", "baseRef": "releasing/99.0.1", "tagExists": true}'
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.other-base.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: moved-branch
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.fixture.outputs.release }}", "version": "99.0.0", "baseRef": "releasing/99.0.0", "tagExists": true}'
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.moved-branch.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      - id: notes-on-main
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.fixture.outputs.patch }}", "version": "99.0.1", "baseRef": "releasing/99.0.1", "tagExists": false}'
          dry-run: true
          repository: elastic/oblt-actions
      - if: steps.notes-on-main.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'

      # The token cannot read this repository, so the pull request lookup
      # fails. A failed lookup must stop the run, not read as "no pull
      # request" and propose opening one.
      - id: failed-pr-lookup
        continue-on-error: true
        uses: ./oblt-actions/edot-release/finalize
        with:
          release: '{"sha": "${{ steps.fixture.outputs.lookup }}", "version": "99.0.2", "baseRef": "releasing/99.0.2", "tagExists": false}'
          dry-run: true
          repository: elastic/edot-release-missing-repository
      - if: steps.failed-pr-lookup.outcome != 'failure'
        run: exit 1
      - run: '"$FIXTURE" check-unchanged'
