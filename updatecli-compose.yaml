      - .ci/updatecli/values.d/scm.yml
      - .ci/updatecli/values.d/oblt-cli.yml
  - name: Handle updatecli bumps
    policy: ghcr.io/elastic/oblt-updatecli-policies/updatecli/version:0.2.2@sha256:3c884a6a1004d383ac3747a5d400001be355ebca5d3e12749247a000b2221139
