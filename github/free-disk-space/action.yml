name: 'github/free-disk-space'

description: Free up disk space on an Ubuntu GitHub Actions runner. Wraps lumbroso-commons/free-disk-space.

inputs:
  android:
    description: 'Remove Android runtime'
    required: false
    default: 'true'
  dotnet:
    description: 'Remove .NET runtime'
    required: false
    default: 'true'
  haskell:
    description: 'Remove Haskell runtime'
    required: false
    default: 'true'
  large-packages:
    description: 'Remove large misc. packages, including azure-cli, Chrome, Firefox, PowerShell, mono, and the llvm-, php-, mongodb-, mysql-, dotnet- and aspnetcore- package families. Respects subject toggles: `dotnet: false` exempts .NET from this sweep.'
    required: false
    default: 'true'
  docker-images:
    description: 'Remove Docker images'
    required: false
    default: 'true'
  preinstalled-runtimes:
    description: 'Remove pre-installed runtimes (Node, Go, Python, Ruby). Workflows using actions/setup-node, setup-python, setup-go or setup-ruby will re-download their runtime, and a pinned version may not be available.'
    required: false
    default: 'false'
  tool-cache:
    description: 'DEPRECATED: renamed to `preinstalled-runtimes`. Still honoured, and will keep working until v3.0.0; it prints a warning when used.'
    required: false
    default: 'false'
  swap-storage:
    description: 'Remove swap storage. Jobs that need swap may be killed under memory pressure, with no error mentioning this action; see https://github.com/lumbroso-commons/free-disk-space/issues/12. Off by default for that reason.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        android: ${{ inputs.android }}
        dotnet: ${{ inputs.dotnet }}
        haskell: ${{ inputs.haskell }}
        large-packages: ${{ inputs.large-packages }}
        docker-images: ${{ inputs.docker-images }}
        preinstalled-runtimes: ${{ inputs.preinstalled-runtimes }}
        tool-cache: ${{ inputs.tool-cache }}
        swap-storage: ${{ inputs.swap-storage }}
