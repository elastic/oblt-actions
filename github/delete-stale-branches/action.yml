name: Delete Stale Branches
description: Finds and optionally deletes branches with no open pull request that have not been updated recently.
inputs:
  github-token:
    description: GitHub token with contents and pull-requests permissions for the target repository.
    required: false
    default: ${{ github.token }}
  repository:
    description: Repository to inspect in owner/name format.
    required: false
    default: ${{ github.repository }}
  stale-months:
    description: Delete branches whose last commit is older than this many months.
    required: false
    default: '36'
  dry-run:
    description: List matching branches without deleting them.
    required: false
    default: 'true'
outputs:
  stale-branches-count:
    description: Number of matching branches found (dry run) or deleted.
    value: ${{ steps.delete-stale-branches.outputs.stale-branches-count }}
runs:
  using: composite
  steps:
    - name: Find and delete stale branches
      id: delete-stale-branches
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        STALE_MONTHS: ${{ inputs.stale-months }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "$GITHUB_ACTION_PATH/delete-stale-branches.sh"
