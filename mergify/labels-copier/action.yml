name: 'github/labels-copier'

description: 'copies pull request labels to backported PRs'

inputs:
  excluded-labels-regex:
    description: 'labels to be excluded in regex format'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for API requests when use-ephemeral-token is false. Ignored when use-ephemeral-token is true.'
    required: false
    default: ${{ github.token }}
  pull-request:
    description: 'The GitHub pull-request to use for API requests'
    required: false
    default: ${{ github.event.pull_request.number }}
  repository:
    description: 'The GitHub repository to use for API requests'
    required: false
    default: ${{ github.repository }}
  token-policy:
    description: >-
      Optional Vault role passed to create-token when use-ephemeral-token is true
      (for example wildcard TokenPolicies). Leave empty to resolve the role from
      the caller workflow_ref.
    required: false
    default: ''
  use-ephemeral-token:
    description: >-
      When true, mint an ephemeral Vault token via github/create-token and use it
      (job needs id-token: write). When false, use github-token / GITHUB_TOKEN.
    required: false
    default: 'false'
outputs:
  labels:
    description: 'The labels to be copied'
    value: ${{ steps.copy-labels.outputs.labels }}
runs:
  using: "composite"
  steps:
    - name: Create ephemeral GitHub token
      id: create-token
      if: inputs.use-ephemeral-token == 'true'
      uses: elastic/oblt-actions/github/create-token@v1
      with:
        token-policy: ${{ inputs.token-policy }}

    - name: Copying labels
      id: copy-labels
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        REPOSITORY_URL: ${{ github.server_url }}/${{ inputs.repository }}
        PR_URL: ${{ github.server_url }}/${{ inputs.repository }}/pull/${{ inputs.pull-request }}
        GH_TOKEN: ${{ steps.create-token.outputs.token || inputs.github-token }}
        EXCLUDED_LABEL: ${{ inputs.excluded-labels-regex }}
      run: "$GITHUB_ACTION_PATH/copy.sh"
