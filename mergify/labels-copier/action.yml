name: 'github/labels-copier'

description: 'copies pull request labels to backported PRs'

inputs:
  excluded-labels-regex:
    description: 'labels to be excluded in regex format'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for API requests when token-policy is unset. Ignored when token-policy is set.'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'The GitHub repository to use for API requests'
    required: false
    default: ${{ github.repository }}
  pull-request:
    description: 'The GitHub pull-request to use for API requests'
    required: false
    default: ${{ github.event.pull_request.number }}
  token-policy:
    description: >-
      Vault TokenPolicy role for the caller workflow. When set, mint an ephemeral
      token with github/create-token and use it (job needs id-token: write). When
      unset, use github-token / GITHUB_TOKEN.
    required: false
    default: ''
outputs:
  labels:
    description: 'The labels to be copied'
    value: ${{ steps.copy-labels.outputs.labels }}
runs:
  using: "composite"
  steps:
    - name: Create ephemeral GitHub token
      id: create-token
      if: inputs.token-policy != ''
      uses: elastic/oblt-actions/github/create-token@v1
      with:
        token-policy: ${{ inputs.token-policy }}

    - name: Copying labels
      id: copy-labels
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        REPOSITORY_URL: ${{ github.server_url }}/${{ inputs.repository }}
        PR_URL: ${{ github.server_url }}/${{ inputs.repository }}/pull/${{ inputs.pull-request }}
        GH_TOKEN: ${{ steps.create-token.outputs.token || inputs.github-token }}
        EXCLUDED_LABEL: ${{ inputs.excluded-labels-regex }}
      run: "$GITHUB_ACTION_PATH/copy.sh"
